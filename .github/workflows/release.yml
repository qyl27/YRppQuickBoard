name: Release

on:
  push:
    tags:
      - 'v**'

env:
  SOLUTION_FILE_PATH: .
  BUILD_CONFIGURATION: Release

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - uses: rlespinasse/github-slug-action@ef93b2ea4b6405d06fd8684fc3ff795d262ecae8 # v5

      - name: Build Artifacts
        uses: ./.github/actions/build-artifacts
        with:
          sln-path: ${{ env.SOLUTION_FILE_PATH }}
          build-config: ${{ env.BUILD_CONFIGURATION }}
          version-tag: ${{ env.GITHUB_REF_SLUG }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: rlespinasse/github-slug-action@ef93b2ea4b6405d06fd8684fc3ff795d262ecae8 # v5

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: 'artifacts'
          path: 'output'
      - run: ls -R output

      - name: Publish release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          make_latest: true
          preserve_order: true
          tag_name: ${{ env.GITHUB_REF_SLUG }}
          name: "Release ${{ env.GITHUB_REF_SLUG }}"
          files: |
            output/**/*.@(dll|pdb)
